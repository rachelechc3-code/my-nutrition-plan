<script>

const wd=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const month=['','GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const currentIndex=()=>{const d=new Date().getDay();return d===0?6:d-1};
const tomorrowIndex=()=> (currentIndex()+1)%7;

function go(p){S.page=p;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function currentPlanDay(){return Number(S.week[currentIndex()])}
function day(){return DB.days[String(currentPlanDay())]}
function fmtDate(){return new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}
function greeting(){const h=new Date().getHours();return h>=5&&h<12?'Good morning.':h>=12&&h<18?'Good afternoon.':'Good evening.'}

const breakfastTypes={
  B1:{n:'Overnight oats',items:[['Fage Total 0%','100 g'],['Latte di mandorla','100 ml'],["Fiocchi d'avena",'60 g'],['Frutta secca e oleosa','10 g']],note:'Cacao amaro: 1 cucchiaino, se desiderato.'},
  B2:{n:'Toast avocado & salmone',items:[['Pane integrale','80 g'],['Avocado','60 g'],['Salmone affumicato','50 g']]},
  B3:{n:'Fage, muesli & frutta',items:[['Fage Total 0%','150 g'],['Muesli','50 g'],['Frutta di stagione','200 g']]},
  B4:{n:'Pane, uova & frutta',items:[['Pane integrale','80 g'],['Uova intere','120 g'],['Frutta di stagione','200 g']]},
  B5:{n:'Pane & proteina',items:[['Pane integrale','80 g'],['Uova intere','120 g']],note:'Oppure una delle alternative proteiche autorizzate del Giorno 7.'}
};
const initialBreakfastByPlanDay={1:'B1',2:'B2',3:'B3',4:'B4',5:'B3',6:'B1',7:'B5'};
function breakfastForWeekday(i){return S.breakfasts[i]||initialBreakfastByPlanDay[S.week[i]]||'B1'}
function breakfastLabel(i){return breakfastTypes[breakfastForWeekday(i)]?.n||'Colazione'}
function ensureMeal(dayNo){if(!S.meals[dayNo])S.meals[dayNo]={};return S.meals[dayNo]}
function chosen(dayNo,slot,group){return S.meals[dayNo]?.[slot]?.[group]||null}
function setChoice(dayNo,slot,group,value){
  ensureMeal(dayNo)[slot]=ensureMeal(dayNo)[slot]||{};
  S.meals[dayNo][slot][group]=value;
  save(); render(); toast('Scelta salvata');
}
function toggleTomorrow(){const i=tomorrowIndex();S.workouts[i]=!S.workouts[i];save();render();toast(S.workouts[i]?'Allenamento di domani impostato':'Allenamento rimosso')}

function mealTitle(m){
 const map={L1:'Carboidrato · verdure · latticino',L2:'Carboidrato · verdure · affettato',L3:'Carboidrato · verdure · legumi',L4:'Carboidrato · verdure · tonno',L5:'Pane · verdure · carne bianca',D1:'Pane · verdure · pesce',D2:'Pane · verdure · uova · frutta',D3:'Pane · verdure · pesce · frutta',D4:'Pane · verdure · carne · frutta',D5:'Pizza pomodoro & mozzarella'};
 return map[m.type]||'Pasto';
}
function mealSummary(dayNo,slot){
 const m=DB.days[String(dayNo)][slot], c=S.meals[dayNo]?.[slot]||{};
 if(m.type==='D5')return '350 g · scegli il pasto previsto';
 const parts=[];
 if(c.carb||c.bread)parts.push((c.carb||c.bread).name);
 if(c.protein)parts.push(c.protein.name);
 if(c.veg)parts.push(c.veg.name);
 if(c.fruit)parts.push(c.fruit.name);
 return parts.length?parts.join(' · '):'Tocca per scegliere le alternative';
}
function mealCard(label,title,sub,kind,slot){
 return `<div class="mealCard" onclick="openMeal('${slot}')"><div class="mealVisual ${kind}"></div><div class="mealInfo"><div class="eyebrow">${label}</div><div class="mealName">${title}</div><div class="mealSub">${sub}</div></div><div class="chev">›</div></div>`;
}
function progressForToday(){

 const breakfastDone=!!S.breakfasts[currentIndex()]||!!b;
 const lunchDone=!!m.lunch;
 const snackDone=!!m.snack;
 const dinnerDone=!!m.dinner;
 return [breakfastDone,lunchDone,snackDone,dinnerDone].filter(Boolean).length;
}
function today(){
 const d=day(),bi=currentIndex(),b=breakfastTypes[breakfastForWeekday(bi)],w=S.workouts[bi],progress=progressForToday(),tom=tomorrowIndex();

 ${mealCard('COLAZIONE',b.n,b.items.map(x=>x.join(' · ')).join('  ·  ')+(b.note?' · '+b.note:''),'breakfast','breakfast')}
 ${mealCard('PRANZO',mealTitle(d.lunch),mealSummary(d,'lunch'),'lunch','lunch')}
 ${mealCard('SPUNTINO','Frutta + frutta secca',mealSummary(d,'snack'),'snack','snack')}
 ${mealCard('CENA',mealTitle(d.dinner),mealSummary(d,'dinner'),'dinner','dinner')}
 </div>
 <div class="section"><div class="sectionHead"><h2>Tomorrow</h2><span>PREPARATION</span></div><div class="workout"><div class="row"><div><div class="eyebrow">DOMANI MATTINA</div><div class="workoutTitle">${S.workouts[tom]?'Allenamento previsto':'Nessun allenamento previsto'}</div></div><button class="toggle ${S.workouts[tom]?'on':''}" aria-label="Allenamento domani" onclick="event.stopPropagation();toggleTomorrow()"><i></i></button></div><p>${S.workouts[tom]?'Allenamento mattutino selezionato. Alle 20:00 prepara lo snack post-workout e organizza il giorno successivo.':'Nessun allenamento selezionato per domani. Attiva l’interruttore se prevedi un allenamento mattutino.'}</p></div></div>
 <div class="section"><div class="quickGrid"><div class="quick olive"><div class="eyebrow">ACQUA</div><div class="num">2 L</div><p>Obiettivo minimo indicato nelle istruzioni del piano.</p></div><div class="quick rose"><div class="eyebrow">SERA</div><div class="num">${d.choc||'—'}</div><p>${d.choc?'Cioccolato fondente previsto.':'Nessun cioccolato indicato.'}</p></div></div></div>`;
}

function week(){
 const ti=tomorrowIndex();
 return `<section class="pageTitle"><div class="eyebrow">PLANNER</div><h1>La tua settimana.</h1><p>Assegna i Giorni 1–7 liberamente. Se scegli un numero già assegnato, i due giorni vengono automaticamente scambiati.</p></section>
 <div class="card"><div class="dayStrip">${wd.map((x,i)=>`<button class="dayBtn ${i===currentIndex()?'active':''}" onclick="editDay(${i})">${x}<strong>${S.week[i]}</strong></button>`).join('')}</div></div>

function editDay(i){

function assign(i,n){
 const j=S.week.indexOf(n);
 if(j===-1)S.week[i]=n;
 else if(j!==i){const old=S.week[i];S.week[i]=n;S.week[j]=old;toast(`${wd[i]} e ${wd[j]} scambiati`);}

}
function breakfastChooser(){
 const bi=currentIndex(),current=breakfastForWeekday(bi);
 const source=[...new Set(Object.values(initialBreakfastByPlanDay))];
 return `<div class="sheetTop"><div><div class="eyebrow">COLAZIONE</div><h2>Scegli la tua.</h2></div><button class="close" onclick="closeModal()">×</button></div>
 <p class="small muted">Il nutrizionista ha autorizzato lo scambio delle colazioni tra i 7 giorni. Le quantità restano quelle del piano.</p>
 ${source.map(k=>{const b=breakfastTypes[k];return `<button class="selectOption ${current===k?'selected':''}" onclick="swapBreakfast('${k}')"><div class="left"><span class="radio"></span><div><b>${b.n}</b><div class="miniStat">${b.items.map(x=>x.join(' · ')).join(' · ')}</div>${b.note?`<div class="miniStat">${b.note}</div>`:''}</div></div><span class="qty">${current===k?'Scelta':'Scegli'}</span></button>`}).join('')}`;
}
function swapBreakfast(k){
 const i=currentIndex(),current=breakfastForWeekday(i),j=Object.keys(S.breakfasts).map(Number).find(x=>x!==i&&breakfastForWeekday(x)===k);
 if(current===k){closeModal();return}
 if(j!==undefined){const other=breakfastForWeekday(j);S.breakfasts[i]=k;S.breakfasts[j]=current;toast(`${wd[i]} e ${wd[j]} scambiati`);}
 else {S.breakfasts[i]=k;toast('Colazione aggiornata');}

}

function seasonalOptions(type){
 const m=new Date().getMonth()+1;
 const auto=DB.seasonal[m]?.[type]||[];

 return [...new Set([...auto,...manual])];
}

function foodOptionsFor(m,slot){
 const groups=[];
 if(m.carb)groups.push(['carb','CARBOIDRATO',m.carb]);
 if(m.bread)groups.push(['bread','CARBOIDRATO',m.bread]);
 if(m.veg)groups.push(['veg','VERDURA',seasonalOptions('veg').map(x=>[x,m.veg])]);
 if(m.protein)groups.push(['protein','PROTEINA',m.protein]);
 if(m.items){
   // Day 2/5 dinner contains eggs, egg whites and fruit: each is a required component, not alternatives to each other.
   if(m.items.some(x=>x[0]==='Uova intere')) groups.push(['egg','UOVA + ALBUME',m.items.filter(x=>x[0]!=='Frutta di stagione')]);
   else groups.push(['items','COMPONENTI',m.items.filter(x=>x[0]!=='Frutta di stagione')]);
 }
 if(m.fruit)groups.push(['fruit','FRUTTA',seasonalOptions('fruit').map(x=>[x,m.fruit])]);
 // For D2, fruit is inside items.
 if(m.items?.some(x=>x[0]==='Frutta di stagione'))groups.push(['fruit','FRUTTA',seasonalOptions('fruit').map(x=>[x,m.items.find(y=>y[0]==='Frutta di stagione')[1]])]);

}

   const p=m.items[0];
   const sel=chosen(dayNo,slot,'pizza');

 } else {
   for(const [key,title,opts] of groups){
     html+=`<div class="selectGroup"><div class="selectGroupTitle">${title}</div>${opts.map(o=>optionButton(dayNo,slot,key,o)).join('')}</div>`;

}

function recipeCat(i){
 const cats=[['Colazioni','breakfast'],['Pranzi','lunch'],['Cene','dinner'],['Spuntini','snack']], [title,type]=cats[i];

 document.getElementById('modal').classList.add('open');
}
function recipeDetail(type,n){
 const r=recipeData[type][n];
 document.getElementById('modalContent').innerHTML=`<div class="sheetTop"><div><div class="eyebrow">RICETTA</div><h2>${r[0]}</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="recipeDetail"><h3>Ingredienti</h3><ul>${r[1].map(x=>`<li>${x}</li>`).join('')}</ul><h3>Preparazione</h3><p class="small">${r[2]}</p></div><button class="action soft" onclick="recipeCat(${['breakfast','lunch','dinner','snack'].indexOf(type)})">← Torna alla lista</button>`;
}
function shop(){
 const items=buildShoppingList();
 const m=new Date().getMonth()+1;
 return `<section class="pageTitle"><div class="eyebrow">WEEKLY SHOPPING</div><h1>La spesa.</h1><p>Qui compaiono soltanto gli alimenti effettivamente scelti nei tuoi 7 giorni.</p></section>
 <div class="notice"><b>Come funziona</b><br>Le alternative del piano non vengono aggiunte automaticamente. Frutta e verdura stagionali diventano parte della spesa solo dopo che le hai scelte nei pasti.</div>
 ${items.length?`<div class="card"><div class="row"><h2>Lista della settimana</h2><span class="pill">${items.length} articoli</span></div>${items.map(shopLine).join('')}</div>`:`<div class="card empty">Non hai ancora confermato alimenti per la settimana. Apri Colazione, Pranzo, Spuntino o Cena e seleziona le alternative.</div>`}
 <div class="card"><div class="row"><div><div class="eyebrow">STAGIONALITÀ</div><h2>Ottobre</h2></div><button class="action soft" onclick="season()">Gestisci</button></div><p class="small muted">Queste sono opzioni disponibili, non una lista da acquistare automaticamente.</p></div>`;
}
function canonical(name){return name.trim().toLowerCase().replace(/\s+/g,' ')}
function addAgg(map,name,qty,unit='g'){
 const key=canonical(name);
 if(!map[key])map[key]={name,qty:0,unit};
 const num=parseFloat(String(qty).replace(',','.'));
 if(Number.isFinite(num))map[key].qty+=num;
}
function parseQty(q){const m=String(q).match(/([\d.,]+)/);return m?parseFloat(m[1].replace(',','.')):null}
function unitOf(q){return String(q).includes('ml')?'ml':'g'}
function buildShoppingList(){
 const map={};
 // Breakfasts: every weekday contributes the selected breakfast.
 for(let i=0;i<7;i++){
   const k=breakfastForWeekday(i), b=breakfastTypes[k];
   b.items.forEach(([name,q])=>{
     if(name==='Frutta di stagione') {
       const chosen=S.meals[S.week[i]]?.breakfast?.fruit;
       if(chosen)addAgg(map,chosen.name,parseQty(q),unitOf(q));
     } else addAgg(map,name,parseQty(q),unitOf(q));
   });
 }
 // Meal selections are attached to plan day number.
 for(let dayNo=1;dayNo<=7;dayNo++){
   const dayState=S.meals[dayNo]||{};
   ['lunch','dinner','snack'].forEach(slot=>{
     const c=dayState[slot]||{};
     Object.keys(c).forEach(k=>{
       const v=c[k]; if(v&&v.name){
         // Only explicit choices are included.
         addAgg(map,v.name,parseQty(v.qty),unitOf(v.qty));
       }
     });
     if(slot==='snack' && !c.fruit) {
       // Do not invent a seasonal fruit.
     }
   });
 }
 // Fixed daily items not stored as selectable choices: chocolate and daily oil.
 // They are included because the plan explicitly specifies them.
 for(let dayNo=1;dayNo<=7;dayNo++){
   const d=DB.days[String(dayNo)];
   if(d.choc)addAgg(map,'Cioccolato fondente',parseQty(d.choc),'g');
   if(d.oil)addAgg(map,'Olio EVO',parseQty(d.oil),'g');
 }
 return Object.values(map).filter(x=>x.qty>0).sort((a,b)=>a.name.localeCompare(b.name,'it'));
}
function shopLine(item){
 const k='shop:'+canonical(item.name)+'|'+item.unit;
 const done=!!S.shoppingChecks[k];
 return `<div class="shopItem" onclick="S.shoppingChecks['${k}']=!S.shoppingChecks['${k}'];save();render()"><span class="check ${done?'done':''}">${done?'✓':''}</span><span class="name">${escapeHtml(item.name)}</span><span class="amount">${Number.isInteger(item.qty)?item.qty:item.qty.toFixed(1)} ${item.unit}</span></div>`;
}
function season(){
 const m=new Date().getMonth()+1;
 document.getElementById('modalContent').innerHTML=`<div class="sheetTop"><div><div class="eyebrow">STAGIONALITÀ</div><h2>${month[m]}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="small muted">La lista automatica segue il mese corrente. Le aggiunte manuali si sommano senza sostituire l'elenco automatico.</p><div class="selectGroup"><div class="selectGroupTitle">FRUTTA DISPONIBILE</div>${seasonalOptions('fruit').map(x=>`<div class="selectOption" style="cursor:default"><div class="left"><span class="radio"></span><b>${escapeHtml(x)}</b></div></div>`).join('')}</div><div class="selectGroup"><div class="selectGroupTitle">VERDURA DISPONIBILE</div>${seasonalOptions('veg').map(x=>`<div class="selectOption" style="cursor:default"><div class="left"><span class="radio"></span><b>${escapeHtml(x)}</b></div></div>`).join('')}</div><input id="mf" class="input" placeholder="Aggiungi frutta"><button class="action primary" onclick="addSeason('fruit')">+ Aggiungi frutta</button><input id="mv" class="input" placeholder="Aggiungi verdura" style="margin-top:14px"><button class="action primary" onclick="addSeason('veg')">+ Aggiungi verdura</button>`;
 document.getElementById('modal').classList.add('open');
}
function addSeason(t){const id=t==='fruit'?'mf':'mv',v=document.getElementById(id).value.trim();if(v){S.manualSeason[t].push(v);save();season();toast('Aggiunta salvata')}}
function archive(){S.history.push({date:new Date().toISOString(),week:[...S.week],workouts:[...S.workouts],meals:JSON.parse(JSON.stringify(S.meals)),breakfasts:JSON.parse(JSON.stringify(S.breakfasts))});save();toast('Settimana archiviata')}
function more(){
 return `<section class="pageTitle"><div class="eyebrow">SETTINGS & MEMORY</div><h1>Il tuo sistema.</h1><p>Tutto ciò che serve per mantenere il piano ordinato nel tempo.</p></section>
 <div class="card"><div class="eyebrow">STAGIONALITÀ</div><h2>Frutta & verdura</h2><p class="small muted">Automatico per mese + aggiunte manuali.</p><button class="action primary" onclick="season()">Gestisci</button></div>
 <div class="card"><div class="eyebrow">STORICO</div><h2>${S.history.length} settimane</h2><p class="small muted">Conserva una fotografia della configurazione corrente.</p><button class="action soft" onclick="archive()">Archivia settimana</button></div>
 <div class="card"><div class="eyebrow">NUOVO PIANO</div><h2>Aggiorna il piano.</h2><p class="small muted">Il pulsante di importazione verrà collegato a un vero modulo di aggiornamento quando sarà disponibile.</p><button class="action primary" onclick="toast('Aggiornamento piano: da collegare')">Importa nuovo piano</button></div>
 <div class="card"><div class="eyebrow">REGOLE DEL PIANO</div><h2>Da tenere a mente.</h2>${DB.rules.map(x=>`<div class="rule">${escapeHtml(x)}</div>`).join('')}</div>`;
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
render();
