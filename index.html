<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#efe9df"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="My Nutrition Plan">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>My Nutrition Plan</title>
<style>
:root{--ivory:#f5f0e8;--cream:#fbf8f2;--espresso:#2e2a26;--muted:#756e65;--champ:#b59b73;--olive:#68705a;--line:#ded5c9;--shadow:0 12px 30px rgba(46,42,38,.08);--r:22px}*{box-sizing:border-box}body{margin:0;background:var(--ivory);color:var(--espresso);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}.app{max-width:680px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:24px 20px 10px;display:flex;justify-content:space-between;align-items:center}.brand{letter-spacing:.18em;font-size:12px}.iconbtn{width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff6}main{padding:8px 18px}.hero{padding:22px 2px 14px}.eyebrow{text-transform:uppercase;letter-spacing:.16em;font-size:10px;color:var(--muted)}h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:4px 0 8px}.hero h1{font-size:38px;line-height:1.02}.hero p,.muted{color:var(--muted)}.card{background:var(--cream);border:1px solid rgba(160,145,126,.28);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin:12px 0}.card.dark{background:var(--espresso);color:#f8f3ea}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{display:inline-flex;padding:7px 10px;border:1px solid var(--line);border-radius:999px;font-size:10px;color:var(--muted)}.big{font:38px Georgia,serif}.progress{height:5px;background:#e4ddd3;border-radius:99px;overflow:hidden;margin:14px 0}.progress i{display:block;height:100%;background:var(--espresso)}.meal{cursor:pointer}.meal:active{transform:scale(.99)}.photo{height:100px;border-radius:17px;background:linear-gradient(135deg,#e7ded0,#c9bca9);display:grid;place-items:center;font-size:38px;margin-bottom:12px}.btn{display:inline-flex;justify-content:center;align-items:center;padding:11px 15px;border-radius:999px;border:1px solid var(--espresso);font-size:12px}.btn.primary{background:var(--espresso);color:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.choice:last-child{border-bottom:0}.choice input{accent-color:var(--espresso)}.qty{margin-left:auto;color:var(--muted);font-size:12px}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.daybtn{padding:10px 4px;border:1px solid var(--line);border-radius:14px;background:var(--cream);font-size:11px}.daybtn.active{background:var(--espresso);color:#fff}.sectiontitle{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 8px}.sectiontitle h2{font-size:23px}.recipe{border-top:1px solid var(--line);padding:14px 0}.tag{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--olive)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:680px;width:100%;background:rgba(251,248,242,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:10}.nav button{font-size:10px;color:var(--muted);padding:6px}.nav button.active{color:var(--espresso);font-weight:700}.modal{position:fixed;inset:0;background:#2e2a2666;display:none;align-items:flex-end;z-index:20}.modal.open{display:flex}.sheet{background:var(--cream);width:100%;max-width:680px;margin:auto 0 0;border-radius:28px 28px 0 0;padding:22px;max-height:84vh;overflow:auto}.close{float:right;border:1px solid var(--line);width:34px;height:34px;border-radius:50%}.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:8px 0}.check{width:22px;height:22px;border:1px solid #aaa;border-radius:7px;display:grid;place-items:center}.check.done{background:var(--espresso);color:white}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%);background:var(--espresso);color:white;padding:10px 14px;border-radius:999px;font-size:12px;display:none;z-index:30}.toast.show{display:block}@media(min-width:700px){.app{box-shadow:0 0 50px #0000000d}.nav{position:sticky;top:0;bottom:auto;transform:none;border:0;border-bottom:1px solid var(--line);margin-bottom:10px}}
</style></head>
<body><div class="app"><header class="top"><div class="brand">MY NUTRITION PLAN</div><button class="iconbtn" onclick="go('more')">⚙︎</button></header><main id="main"></main><nav class="nav"><button data-n="today" onclick="go('today')">⌂<br>Oggi</button><button data-n="week" onclick="go('week')">▦<br>Settimana</button><button data-n="recipes" onclick="go('recipes')">✦<br>Ricette</button><button data-n="shop" onclick="go('shop')">□<br>Spesa</button><button data-n="more" onclick="go('more')">•••<br>Altro</button></nav></div><div class="modal" id="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div class="toast" id="toast"></div>
<script src="data.js"></script><script>
const S=JSON.parse(localStorage.getItem('mnp_state')||'null')||{week:[1,2,3,4,5,6,7],today:0,workouts:[false,false,false,false,false,false,false],breakfasts:{},selected:{},shopping:{},manualSeason:{fruit:[],veg:[]},history:[]};
const wd=['Lun','Mar','Mer','Gio','Ven','Sab','Dom']; const month=['','GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const save=()=>localStorage.setItem('mnp_state',JSON.stringify(S)); function toast(x){let t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1700)} function go(p){S.page=p;save();render()} function closeModal(){document.getElementById('modal').classList.remove('open')}
const breakfasts=[{n:'Overnight oats',items:[['Fage Total 0%','100 g'],['Latte di mandorla','100 ml'],["Fiocchi d'avena",'60 g'],['Frutta secca e oleosa','10 g']],note:'Cacao amaro: 1 cucchiaino, personalizzazione autorizzata dal nutrizionista.'},{n:'Toast avocado & salmone',items:[['Pane integrale','80 g'],['Avocado','60 g'],['Salmone affumicato','50 g']]},{n:'Fage, muesli & frutta',items:[['Fage Total 0%','150 g'],['Muesli','50 g'],['Frutta di stagione','200 g']]},{n:'Pane, uova & frutta',items:[['Pane integrale','80 g'],['Uova intere','120 g'],['Frutta di stagione','200 g']]},{n:'Pane & proteina',items:[['Pane integrale','80 g'],['Uova intere','120 g']],note:'Alternative proteiche del Giorno 7 disponibili nella schermata di scelta.'}];
function day(){return DB.days[String(S.week[S.today])]};function bIndex(){return S.breakfasts[S.today]??0} function mealTitle(m){return ({L1:'Carboidrato + verdure + latticino',L2:'Carboidrato + verdure + affettato magro',L3:'Carboidrato + verdure + legumi',L4:'Carboidrato + verdure + tonno',L5:'Pane + verdure + carne bianca',D1:'Pane + verdure + pesce',D2:'Pane + verdure + uova + frutta',D3:'Pane + verdure + pesce',D4:'Pane + verdure + carne + frutta',D5:'Pizza pomodoro e mozzarella'})[m.type]||'Pasto'}
function card(label,title,sub,slot){return `<div class="card meal" onclick="openMeal('${slot}')"><div class="row"><div><div class="eyebrow">${label}</div><h2>${title}</h2><p class="muted" style="font-size:12px">${sub}</p></div><span>›</span></div></div>`}
function today(){let d=day(), b=breakfasts[bIndex()], w=S.workouts[S.today];return `<section class="hero"><div class="eyebrow">${wd[S.today]} · ${new Date().toLocaleDateString('it-IT',{day:'numeric',month:'long'})}</div><h1>Good morning.</h1><p>Giorno ${S.week[S.today]} · ${w?'allenamento mattutino':'nessun allenamento programmato'}</p><div class="progress"><i style="width:${w?65:40}%"></i></div></section><div class="card"><div class="row"><div><div class="eyebrow">GIORNO</div><div class="big">${String(S.week[S.today]).padStart(2,'0')}</div></div><span class="pill">Piano 30.09.2026</span></div></div>${card('COLAZIONE',b.n,b.items.map(x=>x.join(' · ')).join(' · '),'breakfast')}${card('SPUNTINO','Frutta + frutta secca','200 g + 10 g','snack')}${card('PRANZO',mealTitle(d.lunch),'Solo alternative previste dal piano','lunch')}<div class="card dark"><div class="row"><div><div class="eyebrow" style="color:#cfc5b7">ALLENAMENTO MATTUTINO</div><h2>Ti alleni?</h2><p style="color:#cfc5b7">Il reminder organizzativo è alle 20:00 del giorno precedente.</p></div><button class="btn" onclick="toggleWorkout()">${w?'SÌ':'NO'}</button></div>${w?'<p>🥤 Post-workout: HiPRO Pudding · HiPRO Drink · My-Milk PRO</p>':''}</div>${card('CENA',mealTitle(d.dinner),d.dinner.type==='D5'?'350 g':'Solo alternative previste dal piano','dinner')}${d.choc?`<div class="card"><div class="eyebrow">SPUNTINO SERALE</div><h2>Cioccolato fondente</h2><p class="muted">${d.choc}</p></div>`:''}`}
function week(){return `<section class="hero"><div class="eyebrow">PLANNER</div><h1>La tua settimana.</h1><p>Giorni 1–7 senza duplicazioni. Le colazioni sono sempre intercambiabili.</p></section><div class="card"><div class="daygrid">${wd.map((x,i)=>`<button class="daybtn ${i===S.today?'active':''}" onclick="S.today=${i};save();render()">${x}<br><b>G${S.week[i]}</b>${S.workouts[i]?' · 🏋🏻':''}</button>`).join('')}</div></div><div class="card"><h2>Settimana corrente</h2>${wd.map((x,i)=>`<div class="choice"><b>${x}</b><span class="qty">Giorno ${S.week[i]}</span><button class="btn" onclick="editDay(${i})">Cambia</button></div>`).join('')}</div><div class="card"><h2>Domani alle 20:00</h2><p class="muted">Se domani è programmato un allenamento mattutino, l'app mostra il promemoria per snack post-workout e meal prep.</p></div>`}
function editDay(i){document.getElementById('modalContent').innerHTML='<h2>Giorno per '+wd[i]+'</h2><p class="muted">Scegli un numero non ancora usato.</p>'+[1,2,3,4,5,6,7].map(n=>`<button class="btn" style="margin:4px" onclick="assign(${i},${n})">Giorno ${n}</button>`).join('');document.getElementById('modal').classList.add('open')}
function assign(i,n){if(S.week.some((x,j)=>j!==i&&x===n)){toast('Quel giorno è già usato');return}S.week[i]=n;save();closeModal();render()}
function toggleWorkout(){S.workouts[S.today]=!S.workouts[S.today];save();toast(S.workouts[S.today]?'Allenamento programmato':'Allenamento rimosso');render()}
function openMeal(slot){let d=day(),m=slot==='lunch'?d.lunch:slot==='dinner'?d.dinner:null;if(slot==='breakfast')document.getElementById('modalContent').innerHTML=breakfastChooser();else if(slot==='snack')document.getElementById('modalContent').innerHTML='<h2>Spuntino</h2><div class="card"><b>Frutta di stagione</b><span class="qty">200 g</span></div><div class="card"><b>Frutta secca e oleosa</b><span class="qty">10 g</span></div>';else document.getElementById('modalContent').innerHTML=mealChooser(m,slot);document.getElementById('modal').classList.add('open')}
function breakfastChooser(){return '<h2>Scegli la colazione</h2><p class="muted">Tutte le colazioni possono essere scambiate tra i giorni.</p>'+breakfasts.map((b,i)=>`<div class="recipe"><div class="tag">COLAZIONE ${i+1}</div><h3>${b.n}</h3><p class="small">${b.items.map(x=>x.join(' · ')).join('<br>')}</p>${b.note?'<p class="small muted">'+b.note+'</p>':''}<button class="btn ${i===bIndex()?'primary':''}" onclick="S.breakfasts[S.today]=${i};save();closeModal();render()">${i===bIndex()?'Selezionata':'Scegli'}</button></div>`).join('')}
function mealChooser(m,slot){let out='<h2>'+ (slot==='lunch'?'Pranzo':'Cena')+'</h2><p class="muted">Solo alternative presenti nel piano.</p>'; if(m.carb)out+='<div class="sectiontitle"><h2>Carboidrato</h2></div>'+m.carb.map((x,i)=>`<label class="choice"><input type="radio" name="c" ${i===0?'checked':''}><span>${x[0]}</span><span class="qty">${x[1]}</span></label>`).join(''); if(m.bread)out+='<div class="sectiontitle"><h2>Pane</h2></div>'+m.bread.map((x,i)=>`<label class="choice"><input type="radio" name="b" ${i===0?'checked':''}><span>${x[0]}</span><span class="qty">${x[1]}</span></label>`).join(''); if(m.veg)out+='<div class="card"><b>Verdure di stagione</b><span class="qty">200 g</span></div>'; if(m.protein)out+='<div class="sectiontitle"><h2>Proteina</h2></div>'+m.protein.map((x,i)=>`<label class="choice"><input type="radio" name="p" ${i===0?'checked':''}><span>${x[0]}</span><span class="qty">${x[1]}</span></label>`).join(''); if(m.items)out+='<div class="sectiontitle"><h2>Componenti</h2></div>'+m.items.map(x=>`<div class="choice"><span>${x[0]}</span><span class="qty">${x[1]}</span></div>`).join(''); if(m.fruit)out+='<div class="card"><b>Frutta di stagione</b><span class="qty">'+m.fruit+'</span></div>';return out}
function recipes(){return `<section class="hero"><div class="eyebrow">EDITORIAL RECIPE LIBRARY</div><h1>Ricette.</h1><p>10 opzioni per ogni tipologia di pasto prevista dal piano, con quantità rigorose.</p></section><div class="grid2">${[['🥣','Colazioni'],['🍝','Pranzi'],['🐟','Cene'],['🍎','Spuntini']].map((x,i)=>`<div class="card meal" onclick="recipeCat(${i})"><div class="photo">${x[0]}</div><div class="eyebrow">LIBRERIA</div><h2>${x[1]}</h2><p class="muted small">10 opzioni per tipologia</p></div>`).join('')}</div>`}
function recipeCat(i){let types=i===0?['B1','B2','B3','B4','B5']:i===1?['L1','L2','L3','L4','L5']:i===2?['D1','D2','D3','D4','D5']:['S1'];let names={B1:'Overnight oats',B2:'Toast avocado & salmone',B3:'Fage, muesli & frutta',B4:'Pane, uova & frutta',B5:'Pane & proteina',L1:'Carboidrato + latticino',L2:'Carboidrato + affettato magro',L3:'Carboidrato + legumi',L4:'Carboidrato + tonno',L5:'Pane + carne bianca',D1:'Pesce + pane + verdure',D2:'Uova + pane + verdure',D3:'Pesce + pane + verdure + frutta',D4:'Carne + pane + verdure + frutta',D5:'Pizza pomodoro e mozzarella',S1:'Frutta + frutta secca'};let out='<h2>'+['Colazioni','Pranzi','Cene','Spuntini'][i]+'</h2>';types.forEach(t=>{out+='<div class="sectiontitle"><h2>'+names[t]+'</h2></div>';for(let n=1;n<=10;n++)out+=`<div class="recipe"><div class="tag">${t} · OPZIONE ${n}</div><h3>${names[t]} ${n}</h3><p class="small">Ricetta costruita esclusivamente entro la struttura e le quantità del piano. Variazione di preparazione/verdure stagionali, senza aggiungere alimenti fuori piano.</p><button class="btn" onclick="toast('Ricetta salvata')">Salva</button></div>`});document.getElementById('modalContent').innerHTML=out;document.getElementById('modal').classList.add('open')}
function shop(){let m=new Date().getMonth()+1,fr=[...S.manualSeason.fruit,...DB.seasonal[m].fruit],vg=[...S.manualSeason.veg,...DB.seasonal[m].veg];return `<section class="hero"><div class="eyebrow">WEEKLY SHOPPING</div><h1>La spesa.</h1><p>Solo ciò che hai scelto. Stagionalità ${month[m]}.</p></section><div class="card"><h2>Frutta & verdura</h2><p class="muted">Le quantità verranno calcolate dalle scelte confermate nella build completa.</p><div class="sectiontitle"><h2>Frutta</h2></div>${fr.map(x=>shopLine(x,'frutta')).join('')}<div class="sectiontitle"><h2>Verdura</h2></div>${vg.map(x=>shopLine(x,'verdura')).join('')}</div><div class="card"><h2>Selezioni della settimana</h2><p class="muted">La build completa aggrega qui solo gli alimenti effettivamente scelti, non le alternative.</p></div>`}
function shopLine(x,c){let k=c+x,d=!!S.shopping[k];return `<div class="choice" onclick="S.shopping['${k}']=!S.shopping['${k}'];save();render()"><span class="check ${d?'done':''}">${d?'✓':''}</span><span>${x}</span></div>`}
function more(){return `<section class="hero"><div class="eyebrow">MORE</div><h1>Il tuo sistema.</h1><p>Stagionalità, storico, regole e aggiornamento del piano.</p></section><div class="card"><h2>Stagionalità</h2><p class="muted">Automatico per mese + aggiunte manuali.</p><button class="btn primary" onclick="season()">Gestisci</button></div><div class="card"><h2>Storico</h2><p class="muted">${S.history.length} settimane archiviate.</p><button class="btn" onclick="archive()">Archivia settimana</button></div><div class="card"><h2>Aggiorna piano</h2><p class="muted">Carica la prossima scheda e verifica le modifiche prima di attivarla.</p><button class="btn" onclick="toast('Importazione PDF: modulo previsto per la versione pubblicata')">Nuovo piano</button></div><div class="card"><h2>Regole</h2>${DB.rules.map(x=>`<p class="small muted">• ${x}</p>`).join('')}</div>`}
function season(){let m=new Date().getMonth()+1;document.getElementById('modalContent').innerHTML=`<h2>Stagionalità · ${month[m]}</h2><p class="muted">La lista automatica cambia con il mese. Puoi aggiungere opzioni manuali.</p><input id="mf" class="input" placeholder="Aggiungi frutta"><button class="btn" onclick="addSeason('fruit')">+ Frutta</button><input id="mv" class="input" placeholder="Aggiungi verdura"><button class="btn" onclick="addSeason('veg')">+ Verdura</button><p class="small">Aggiunte: ${S.manualSeason.fruit.concat(S.manualSeason.veg).join(', ')||'nessuna'}</p>`;document.getElementById('modal').classList.add('open')}
function addSeason(t){let id=t==='fruit'?'mf':'mv',v=document.getElementById(id).value.trim();if(v){S.manualSeason[t].push(v);save();season();toast('Aggiunta salvata')}} function archive(){S.history.push({date:new Date().toISOString(),week:[...S.week],workouts:[...S.workouts]});save();toast('Settimana archiviata')}
function render(){let p=S.page||'today';document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.n===p));document.getElementById('main').innerHTML=p==='today'?today():p==='week'?week():p==='recipes'?recipes():p==='shop'?shop():more()} render();
</script></body></html>
