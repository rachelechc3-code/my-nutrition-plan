<html lang="it">
<head>
<meta charset="utf-8">

<title>My Nutrition Plan</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@400;500&display=swap');
:root{
 --ivory:#f4efe7;--paper:#fbf8f3;--paper2:#f7f2ea;--espresso:#302b27;--brown:#5e554d;
 --taupe:#9a8f82;--line:#ded5ca;--champ:#b9a88e;--olive:#69715f;--olive2:#dfe3d8;
 --rose:#e9ddd5;--white:#fffdf9;--shadow:0 18px 45px rgba(48,43,39,.08);--r:26px;
}
*{box-sizing:border-box}html{background:var(--ivory)}body{margin:0;background:var(--ivory);color:var(--espresso);font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}.app{width:100%;max-width:720px;margin:auto;min-height:100vh;padding-bottom:105px}.top{padding:24px 22px 6px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;letter-spacing:.24em;font-weight:500}.topRight{display:flex;gap:8px}.iconbtn{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(255,253,249,.7);color:var(--espresso);font-size:16px}.iconbtn:active,.navbtn:active,.action:active{transform:scale(.97)}main{padding:0 18px}.hero{padding:26px 4px 18px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:9px;color:var(--taupe);font-weight:600}.hero h1{font-family:'Playfair Display',Georgia,serif;font-size:40px;line-height:1.02;font-weight:400;margin:8px 0 10px;letter-spacing:-.02em}.hero p{color:var(--brown);font-size:13px;line-height:1.6;margin:0}.dateLine{display:flex;align-items:center;gap:9px;color:var(--brown);font-size:12px}.dot{width:4px;height:4px;background:var(--champ);border-radius:50%}.dashboardHero{position:relative;overflow:hidden;border-radius:32px;background:var(--espresso);color:var(--paper);padding:24px;margin:4px 0 20px;box-shadow:var(--shadow)}.dashboardHero:after{content:"";position:absolute;width:180px;height:180px;border:1px solid rgba(255,255,255,.12);border-radius:50%;right:-65px;top:-55px}.dashboardHero:before{content:"";position:absolute;width:110px;height:110px;border:1px solid rgba(255,255,255,.08);border-radius:50%;right:-28px;top:-20px}.darkEyebrow{color:#c7bcaf}.heroRow{display:flex;justify-content:space-between;gap:16px;position:relative;z-index:1}.heroBig{font-family:'Playfair Display',Georgia,serif;font-size:43px;line-height:1;margin-top:5px}.heroMeta{font-size:11px;color:#cfc5ba;margin-top:7px}.statusBadge{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:8px 10px;font-size:10px;color:#eee7de;background:rgba(255,255,255,.05);white-space:nowrap}.statusDot{width:6px;height:6px;border-radius:50%;background:#c5d0b7}.progressTrack{height:3px;background:rgba(255,255,255,.14);border-radius:99px;margin-top:20px;overflow:hidden}.progressFill{height:100%;background:#e9dfd0;border-radius:99px}.section{margin:22px 0}.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:0 4px 10px}.sectionHead h2{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:24px;margin:0}.sectionHead span{font-size:10px;color:var(--taupe)}.mealCard{background:var(--paper);border:1px solid rgba(154,143,130,.22);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;box-shadow:0 9px 26px rgba(48,43,39,.045);margin:9px 0;cursor:pointer}.mealVisual{height:84px;border-radius:20px;display:grid;place-items:center;position:relative;overflow:hidden}.mealVisual:after{content:"";width:50px;height:50px;border-radius:50%;border:1px solid rgba(48,43,39,.13);position:absolute}.mealVisual.breakfast{background:linear-gradient(145deg,#e9e1d3,#d7c9b4)}.mealVisual.lunch{background:linear-gradient(145deg,#e0e1d7,#b9c0a9)}.mealVisual.snack{background:linear-gradient(145deg,#eadfd8,#d6bfb3)}.mealVisual.dinner{background:linear-gradient(145deg,#ddd7cf,#b8aa99)}.mealEmoji{font-size:26px;position:relative;z-index:1;filter:grayscale(.25)}.mealInfo .eyebrow{margin-bottom:5px}.mealName{font-family:'Playfair Display',Georgia,serif;font-size:19px;line-height:1.1}.mealSub{font-size:11px;color:var(--taupe);margin-top:5px;line-height:1.4}.chev{font-size:22px;color:var(--taupe);padding-right:3px}.quickGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.quick{background:var(--paper2);border:1px solid rgba(154,143,130,.2);border-radius:22px;padding:17px;min-height:122px}.quick .num{font-family:'Playfair Display',Georgia,serif;font-size:29px;margin:7px 0}.quick p{font-size:11px;color:var(--brown);line-height:1.45;margin:0}.quick.olive{background:var(--olive2)}.quick.rose{background:var(--rose)}.action{border:1px solid var(--espresso);background:transparent;border-radius:999px;padding:10px 14px;font-size:10px;color:var(--espresso);font-family:inherit}.action.primary{background:var(--espresso);color:var(--paper)}.action.soft{border-color:var(--line);background:rgba(255,255,255,.45)}.workout{background:#e4e7de;border:1px solid #d1d6c9;border-radius:28px;padding:20px}.workoutTitle{font-family:'Playfair Display',Georgia,serif;font-size:25px}.workout p{font-size:11px;line-height:1.55;color:#596052}.pill{display:inline-flex;padding:7px 10px;border-radius:999px;border:1px solid var(--line);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--brown)}.card{background:var(--paper);border:1px solid rgba(154,143,130,.22);border-radius:var(--r);padding:18px;box-shadow:0 9px 26px rgba(48,43,39,.045);margin:10px 0}.card h2{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:24px;margin:0 0 7px}.muted{color:var(--taupe)}.small{font-size:11px;line-height:1.55}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.dayStrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dayBtn{border:0;background:transparent;padding:10px 2px 11px;border-radius:16px;color:var(--taupe);font-family:inherit;font-size:9px}.dayBtn strong{display:block;font-family:'Playfair Display',Georgia,serif;font-size:17px;font-weight:400;color:var(--espresso);margin-top:4px}.dayBtn.active{background:var(--espresso);color:#ddd4ca}.dayBtn.active strong{color:#fffaf3}.choice{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.choice:last-child{border-bottom:0}.qty{margin-left:auto;color:var(--taupe);font-size:11px}.check{width:21px;height:21px;border:1px solid #bdb3a7;border-radius:7px;display:grid;place-items:center;font-size:12px;flex:0 0 auto}.check.done{background:var(--espresso);color:#fff;border-color:var(--espresso)}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);background:rgba(244,239,231,.94);backdrop-filter:blur(18px);border-top:1px solid rgba(154,143,130,.25);display:grid;grid-template-columns:repeat(5,1fr);padding:9px 10px calc(9px + env(safe-area-inset-bottom));z-index:10}.navbtn{border:0;background:transparent;color:var(--taupe);font-family:inherit;font-size:9px;letter-spacing:.02em;padding:4px 0;position:relative}.navIcon{display:block;font-size:16px;line-height:16px;margin-bottom:5px}.navbtn.active{color:var(--espresso)}.navbtn.active:after{content:"";position:absolute;width:4px;height:4px;border-radius:50%;background:var(--champ);bottom:-2px;left:50%;transform:translateX(-50%)}.pageTitle{padding:28px 4px 14px}.pageTitle h1{font-family:'Playfair Display',Georgia,serif;font-size:39px;font-weight:400;margin:7px 0}.pageTitle p{font-size:12px;line-height:1.55;color:var(--brown);margin:0}.recipeGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.recipeTile{background:var(--paper);border:1px solid rgba(154,143,130,.22);border-radius:25px;padding:10px;cursor:pointer}.recipeImage{height:116px;border-radius:19px;display:grid;place-items:center;font-size:34px;margin-bottom:12px}.recipeImage.r1{background:linear-gradient(145deg,#e7dfd1,#cbbda7)}.recipeImage.r2{background:linear-gradient(145deg,#dfe2d7,#b9c0a9)}.recipeImage.r3{background:linear-gradient(145deg,#e4dcd6,#cbb8ac)}.recipeImage.r4{background:linear-gradient(145deg,#ded9d1,#b6aa9c)}.recipeTile h3{font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:400;margin:0 4px 3px}.recipeTile p{font-size:10px;color:var(--taupe);margin:0 4px 5px}.modal{position:fixed;inset:0;background:rgba(48,43,39,.34);backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:30}.modal.open{display:flex}.sheet{width:100%;max-width:720px;max-height:88vh;overflow:auto;background:var(--paper);border-radius:30px 30px 0 0;padding:24px 20px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -15px 50px rgba(48,43,39,.18)}.sheetTop{display:flex;justify-content:space-between;align-items:start;margin-bottom:14px}.sheet h2{font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:29px;margin:0}.close{width:36px;height:36px;border:1px solid var(--line);background:transparent;border-radius:50%;font-size:20px;color:var(--brown)}.selectRow{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}.selectRow:last-child{border-bottom:0}.selectRow b{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:400}.selectRow span{font-size:11px;color:var(--taupe);text-align:right}.input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:15px;background:#fffdf9;font:inherit;font-size:12px;margin:6px 0 10px}.toast{position:fixed;left:50%;bottom:94px;transform:translateX(-50%);background:var(--espresso);color:#fffaf3;padding:11px 15px;border-radius:999px;font-size:11px;z-index:40;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.empty{padding:30px 10px;text-align:center;color:var(--taupe);font-size:12px}.rule{border-top:1px solid var(--line);padding:13px 0;font-size:11px;line-height:1.5;color:var(--brown)}.miniStat{font-size:10px;color:var(--taupe)}
@media(min-width:760px){body{padding:22px 0}.app{background:var(--ivory);box-shadow:0 0 70px rgba(48,43,39,.06);border-radius:34px;overflow:hidden}.nav{position:sticky;top:0;bottom:auto;transform:none;border-top:0;border-bottom:1px solid rgba(154,143,130,.25);margin-top:10px}.app{padding-bottom:20px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">MY NUTRITION PLAN</div><div class="topRight"><button class="iconbtn" onclick="go('more')" aria-label="Altro">✦</button></div></header>
<main id="main"></main>
<nav class="nav">
<button class="navbtn" data-n="today" onclick="go('today')"><span class="navIcon">⌂</span>Oggi</button>
<button class="navbtn" data-n="week" onclick="go('week')"><span class="navIcon">▦</span>Settimana</button>
<button class="navbtn" data-n="recipes" onclick="go('recipes')"><span class="navIcon">✦</span>Ricette</button>
<button class="navbtn" data-n="shop" onclick="go('shop')"><span class="navIcon">□</span>Spesa</button>
<button class="navbtn" data-n="more" onclick="go('more')"><span class="navIcon">•••</span>Altro</button>
</nav>
</div>
<div class="modal" id="modal"><div class="sheet"><div id="modalContent"></div></div></div><div class="toast" id="toast"></div>
<script src="data.js"></script>
<script>
const saved=JSON.parse(localStorage.getItem('mnp_state')||'null');
const S=saved||{page:'today',week:[1,2,3,4,5,6,7],today:new Date().getDay()===0?6:new Date().getDay()-1,workouts:[false,false,false,false,false,false,false],breakfasts:{},selected:{},shopping:{},manualSeason:{fruit:[],veg:[]},history:[]};
const wd=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const month=['','GEN','FEB','MAR','APR','MAG','GIU','LUG','AGO','SET','OTT','NOV','DIC'];
const save=()=>localStorage.setItem('mnp_state',JSON.stringify(S));
function toast(x){const t=document.getElementById('toast');t.textContent=x;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function go(p){S.page=p;save();render();window.scrollTo({top:0,behavior:'smooth'})}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function day(){return DB.days[String(S.week[S.today])]}
const breakfasts=[
 {n:'Overnight oats',items:[['Fage Total 0%','100 g'],['Latte di mandorla','100 ml'],["Fiocchi d'avena",'60 g'],['Frutta secca e oleosa','10 g']],note:'Cacao amaro: 1 cucchiaino, se desiderato.'},
 {n:'Toast avocado & salmone',items:[['Pane integrale','80 g'],['Avocado','60 g'],['Salmone affumicato','50 g']]},
 {n:'Fage, muesli & frutta',items:[['Fage Total 0%','150 g'],['Muesli','50 g'],['Frutta di stagione','200 g']]},
 {n:'Pane, uova & frutta',items:[['Pane integrale','80 g'],['Uova intere','120 g'],['Frutta di stagione','200 g']]},
 {n:'Pane & proteina',items:[['Pane integrale','80 g'],['Uova intere','120 g']],note:'Alternative proteiche del Giorno 7 disponibili.'}
];
function bIndex(){return S.breakfasts[S.today]??0}
function mealTitle(m){return ({L1:'Carboidrato · verdure · latticino',L2:'Carboidrato · verdure · affettato',L3:'Carboidrato · verdure · legumi',L4:'Carboidrato · verdure · tonno',L5:'Pane · verdure · carne bianca',D1:'Pane · verdure · pesce',D2:'Pane · verdure · uova · frutta',D3:'Pane · verdure · pesce · frutta',D4:'Pane · verdure · carne · frutta',D5:'Pizza pomodoro & mozzarella'})[m.type]||'Pasto'}
function fmtDate(){return new Date().toLocaleDateString('it-IT',{day:'numeric',month:'long'})}
function mealCard(label,title,sub,kind,slot){return `<div class="mealCard" onclick="openMeal('${slot}')"><div class="mealVisual ${kind}"><span class="mealEmoji">${kind==='breakfast'?'☕':kind==='lunch'?'🥗':kind==='snack'?'🍑':'🍽️'}</span></div><div class="mealInfo"><div class="eyebrow">${label}</div><div class="mealName">${title}</div><div class="mealSub">${sub}</div></div><div class="chev">›</div></div>`}
function today(){
 const d=day(),b=breakfasts[bIndex()],w=S.workouts[S.today],done=S.selected[S.today]||{}; const progress=[done.breakfast,done.lunch,done.snack,done.dinner].filter(Boolean).length;
 return `<section class="hero"><div class="dateLine"><span>${wd[S.today]}</span><i class="dot"></i><span>${fmtDate()}</span></div><h1>Good evening.</h1><p>Il tuo piano, organizzato con calma.</p></section>
 <div class="dashboardHero"><div class="heroRow"><div><div class="eyebrow darkEyebrow">GIORNO DEL PIANO</div><div class="heroBig">${S.week[S.today]}</div><div class="heroMeta">Piano attivo · 30.09.2026</div></div><span class="statusBadge"><span class="statusDot"></span>${progress}/4 completati</span></div><div class="progressTrack"><div class="progressFill" style="width:${progress*25}%"></div></div></div>
 <div class="section"><div class="sectionHead"><h2>Today</h2><span>${w?'TRAINING DAY':'REST DAY'}</span></div>
 ${mealCard('COLAZIONE',b.n,b.items.map(x=>x.join(' · ')).join('  ·  '),'breakfast','breakfast')}
 ${mealCard('PRANZO',mealTitle(d.lunch),'200 g verdure · scegli una sola alternativa','lunch','lunch')}
 ${mealCard('SPUNTINO','Frutta + frutta secca','200 g + 10 g','snack','snack')}
 ${mealCard('CENA',mealTitle(d.dinner),d.dinner.type==='D5'?'350 g':'200 g verdure · scegli una sola alternativa','dinner','dinner')}
 </div>
 <div class="section"><div class="sectionHead"><h2>Tomorrow</h2><span>PREPARATION</span></div><div class="workout"><div class="row"><div><div class="eyebrow">DOMANI MATTINA</div><div class="workoutTitle">${S.workouts[(S.today+1)%7]?'Allenamento previsto':'Nessun allenamento previsto'}</div></div><button class="action ${S.workouts[(S.today+1)%7]?'primary':''}" onclick="toggleTomorrow()">${S.workouts[(S.today+1)%7]?'SNACK EXTRA':'Imposta'}</button></div><p>${S.workouts[(S.today+1)%7]?'Alle 20:00: prepara lo snack post-workout e organizza il pasto di domani.':'Alle 20:00 puoi preparare colazione e snack del giorno successivo.'}</p></div></div>
 <div class="section"><div class="quickGrid"><div class="quick olive"><div class="eyebrow">ACQUA</div><div class="num">2 L</div><p>Obiettivo minimo indicato nelle istruzioni del piano.</p></div><div class="quick rose"><div class="eyebrow">SERA</div><div class="num">${d.choc||'—'}</div><p>${d.choc?'Cioccolato fondente previsto.':'Nessun cioccolato indicato.'}</p></div></div></div>`;
}
function toggleTomorrow(){const i=(S.today+1)%7;S.workouts[i]=!S.workouts[i];save();render();toast(S.workouts[i]?'Allenamento di domani impostato':'Allenamento rimosso')}
function week(){return `<section class="pageTitle"><div class="eyebrow">PLANNER</div><h1>La tua settimana.</h1><p>Assegna i Giorni 1–7 liberamente. Nessun giorno numerato viene ripetuto.</p></section><div class="card"><div class="dayStrip">${wd.map((x,i)=>`<button class="dayBtn ${i===S.today?'active':''}" onclick="S.today=${i};save();render()">${x}<strong>${S.week[i]}</strong></button>`).join('')}</div></div><div class="card"><div class="row"><div><h2>Settimana corrente</h2><div class="miniStat">Le colazioni possono essere scambiate tra i giorni.</div></div><span class="pill">7 giorni</span></div>${wd.map((x,i)=>`<div class="choice"><div><b>${x}</b><div class="miniStat">${i===S.today?'Oggi · ':''}Giorno ${S.week[i]} ${S.workouts[i]?'· allenamento':''}</div></div><button class="action soft" onclick="editDay(${i})">Cambia</button></div>`).join('')}</div><div class="card"><div class="eyebrow">ORGANIZZAZIONE</div><h2>Domani alle 20:00</h2><p class="small muted">Prepara in anticipo ciò che serve per il giorno successivo. Se hai allenamento mattutino, ricorda anche lo snack extra autorizzato.</p></div>`}
function editDay(i){document.getElementById('modalContent').innerHTML=`<div class="sheetTop"><div><div class="eyebrow">CAMBIA GIORNO</div><h2>${wd[i]}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="small muted">Scegli un numero non ancora assegnato.</p>${[1,2,3,4,5,6,7].map(n=>`<div class="selectRow"><div><b>Giorno ${n}</b></div><button class="action ${S.week.includes(n)&&S.week[i]!==n?'soft':''}" ${S.week.includes(n)&&S.week[i]!==n?'disabled':''} onclick="assign(${i},${n})">${S.week[i]===n?'Attuale':'Seleziona'}</button></div>`).join('')}`;document.getElementById('modal').classList.add('open')}
function assign(i,n){if(S.week.includes(n)&&S.week[i]!==n){toast('Questo giorno è già assegnato');return}S.week[i]=n;save();closeModal();render();toast('Settimana aggiornata')}
function breakfastChooser(){return `<div class="sheetTop"><div><div class="eyebrow">COLAZIONE</div><h2>Scegli la tua.</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="small muted">Il nutrizionista ha autorizzato lo scambio delle colazioni tra i 7 giorni.</p>${breakfasts.map((b,i)=>`<div class="selectRow"><div><b>${b.n}</b><div class="miniStat">${b.items.map(x=>x.join(' · ')).join(' · ')}</div></div><button class="action ${bIndex()===i?'primary':'soft'}" onclick="S.breakfasts[S.today]=${i};save();closeModal();render();toast('Colazione aggiornata')">${bIndex()===i?'Scelta':'Scegli'}</button></div>`).join('')}`}
function mealChooser(m,slot){let parts=[];if(m.bread)parts.push(['Pane',m.bread]);if(m.carb)parts.push(['Carboidrato',m.carb]);if(m.veg)parts.push(['Verdure',[['Verdure di stagione',m.veg]]]);if(m.protein)parts.push(['Proteina',m.protein]);if(m.items)parts.push(['Componenti',m.items]);if(m.fruit)parts.push(['Frutta',[['Frutta di stagione',m.fruit]]]);return `<div class="sheetTop"><div><div class="eyebrow">${slot==='lunch'?'PRANZO':'CENA'}</div><h2>${mealTitle(m)}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="small muted">Scegli una sola alternativa all'interno delle categorie. I pesi del piano sono massimi.</p>${parts.map(([name,arr])=>`<div class="card" style="margin:10px 0"><div class="eyebrow">${name}</div>${arr.map((x,j)=>`<div class="selectRow"><div><b>${x[0]}</b></div><span>${x[1]}</span></div>`).join('')}</div>`).join('')}`}
function openMeal(slot){let d=day();let html=slot==='breakfast'?breakfastChooser():slot==='snack'?`<div class="sheetTop"><div><div class="eyebrow">SPUNTINO</div><h2>Frutta + frutta secca.</h2></div><button class="close" onclick="closeModal()">×</button></div><div class="selectRow"><b>Frutta di stagione</b><span>200 g</span></div><div class="selectRow"><b>Frutta secca e oleosa</b><span>10 g</span></div>`:mealChooser(slot==='lunch'?d.lunch:d.dinner,slot);document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').classList.add('open')}
function recipeCat(i){const cats=[['Colazioni','breakfast'],['Pranzi','lunch'],['Cene','dinner'],['Spuntini','snack']];const [title,type]=cats[i];const recipes=Array.from({length:10},(_,n)=>({n:n+1,title:type==='breakfast'?['Overnight oats cacao & mela','Toast avocado & salmone','Fage, muesli & frutti rossi','Pane, uova & frutta','Toast proteico & frutta'][n%5]:type==='lunch'?['Pasta al pomodoro e fiocchi di latte','Farro mediterraneo e feta','Riso basmati con bresaola','Pasta tonno e verdure','Pane integrale con ricotta e verdure'][n%5]:type==='dinner'?['Merluzzo al limone e verdure','Orata al forno e finocchi','Frittata al forno e verdure','Pollo alle erbe e carote','Pizza margherita semplice'][n%5]:['Mela croccante e mandorle','Pera e noci','Kiwi e mandorle','Pesca e nocciole','Frutti di bosco e noci'][n%5]}));document.getElementById('modalContent').innerHTML=`<div class="sheetTop"><div><div class="eyebrow">LIBRERIA</div><h2>${title}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="small muted">10 idee organizzative. Per ora la scheda mostra il concept della ricetta; le quantità vanno sempre mantenute secondo il piano.</p>${recipes.map(r=>`<div class="selectRow"><div><b>${r.n}. ${r.title}</b><div class="miniStat">Apri la ricetta</div></div><span>›</span></div>`).join('')}`;document.getElementById('modal').classList.add('open')}
function recipes(){return `<section class="pageTitle"><div class="eyebrow">EDITORIAL RECIPE LIBRARY</div><h1>Ricette.</h1><p>Una libreria organizzata per momento della giornata, con 10 idee per ogni tipologia prevista dal piano.</p></section><div class="recipeGrid">${[['☕','Colazioni','r1'],['🥗','Pranzi','r2'],['🍽️','Cene','r3'],['🍑','Spuntini','r4']].map((x,i)=>`<div class="recipeTile" onclick="recipeCat(${i})"><div class="recipeImage ${x[2]}">${x[0]}</div><h3>${x[1]}</h3><p>10 opzioni · piano rigoroso</p></div>`).join('')}</div>`}
function shop(){const m=new Date().getMonth()+1,fr=[...S.manualSeason.fruit,...DB.seasonal[m].fruit],vg=[...S.manualSeason.veg,...DB.seasonal[m].veg];return `<section class="pageTitle"><div class="eyebrow">WEEKLY SHOPPING</div><h1>La spesa.</h1><p>Stagionalità automatica per ${month[m]}. Qui puoi spuntare ciò che acquisti.</p></section><div class="card"><div class="row"><h2>Frutta</h2><span class="pill">${fr.length} opzioni</span></div>${fr.map(x=>shopLine(x,'frutta')).join('')}</div><div class="card"><div class="row"><h2>Verdura</h2><span class="pill">${vg.length} opzioni</span></div>${vg.map(x=>shopLine(x,'verdura')).join('')}</div><div class="card"><div class="eyebrow">PIANO</div><h2>Scelte confermate</h2><p class="small muted">La lista definitiva della settimana dovrà aggregare soltanto gli alimenti effettivamente selezionati nei pasti.</p></div>`}
function shopLine(x,c){const k=c+x,d=!!S.shopping[k];return `<div class="choice" onclick="S.shopping['${k}']=!S.shopping['${k}'];save();render()"><span class="check ${d?'done':''}">${d?'✓':''}</span><span>${x}</span></div>`}
function season(){const m=new Date().getMonth()+1;document.getElementById('modalContent').innerHTML=`<div class="sheetTop"><div><div class="eyebrow">STAGIONALITÀ</div><h2>${month[m]}</h2></div><button class="close" onclick="closeModal()">×</button></div><p class="small muted">La lista automatica segue il mese corrente. Le aggiunte manuali si sommano senza sostituire l'elenco automatico.</p><input id="mf" class="input" placeholder="Aggiungi frutta"><button class="action primary" onclick="addSeason('fruit')">+ Aggiungi frutta</button><input id="mv" class="input" placeholder="Aggiungi verdura" style="margin-top:14px"><button class="action primary" onclick="addSeason('veg')">+ Aggiungi verdura</button><div class="rule"><b>Manuali</b><br>${S.manualSeason.fruit.concat(S.manualSeason.veg).join(', ')||'Nessuna aggiunta'}</div>`;document.getElementById('modal').classList.add('open')}
function addSeason(t){const id=t==='fruit'?'mf':'mv',v=document.getElementById(id).value.trim();if(v){S.manualSeason[t].push(v);save();season();toast('Aggiunta salvata')}}
function archive(){S.history.push({date:new Date().toISOString(),week:[...S.week],workouts:[...S.workouts]});save();toast('Settimana archiviata')}
function toggleWorkout(){S.workouts[S.today]=!S.workouts[S.today];save();render();toast(S.workouts[S.today]?'Allenamento impostato':'Allenamento rimosso')}
function more(){return `<section class="pageTitle"><div class="eyebrow">SETTINGS & MEMORY</div><h1>Il tuo sistema.</h1><p>Tutto ciò che serve per mantenere il piano ordinato nel tempo.</p></section><div class="card"><div class="eyebrow">STAGIONALITÀ</div><h2>Frutta & verdura</h2><p class="small muted">Automatico per mese + aggiunte manuali.</p><button class="action primary" onclick="season()">Gestisci</button></div><div class="card"><div class="eyebrow">STORICO</div><h2>${S.history.length} settimane</h2><p class="small muted">Conserva una fotografia della configurazione corrente.</p><button class="action soft" onclick="archive()">Archivia settimana</button></div><div class="card"><div class="eyebrow">NUOVO PIANO</div><h2>Aggiorna il piano.</h2><p class="small muted">Quando la nutrizionista consegna una nuova scheda, qui potrà essere sostituita dopo una verifica delle modifiche.</p><button class="action primary" onclick="toast('Modulo di importazione da collegare nella prossima build')">Importa nuovo piano</button></div><div class="card"><div class="eyebrow">REGOLE DEL PIANO</div><h2>Da tenere a mente.</h2>${DB.rules.map(x=>`<div class="rule">${x}</div>`).join('')}</div>`}
function render(){const p=S.page||'today';document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.n===p));document.getElementById('main').innerHTML=p==='today'?today():p==='week'?week():p==='recipes'?recipes():p==='shop'?shop():more()}
render();
</script>
</body>
</html>
